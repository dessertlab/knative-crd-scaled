apiVersion: v1
kind: ServiceAccount
metadata:
  name: loader
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: load-testing-loader
  namespace: default
subjects:
  - kind: ServiceAccount
    name: loader
    namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: real-traffic-test
  namespace: default
spec:
  parallelism: 1
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: loader
      containers:
      - name: load-test
        # image: ko://knative.dev/serving/test/performance/benchmarks/real-traffic-test
        image: docker.io/dessertunina/real-traffic-test@sha256:9aa149f7b282169486d4fe90ab67fc14d9bece3b9a5554ebbfa9d1e9afbce5b9
        args:
        - "-number-of-services=10"
        - "-requests-per-second=50"
        - "-critical-test=false"
        - "-sources-of-interference=5"
        - "-interfering-namespace=interference"
        - "-bucket-node=dessertw3"
        - "-loki-url=http://10.244.1.55:3100"
        env:
          - name: KO_DOCKER_REPO
            valueFrom:
             secretKeyRef:
               name: performance-test-config
               key: kodockerrepo
          - name: SYSTEM_NAMESPACE
            valueFrom:
             secretKeyRef:
               name: performance-test-config
               key: systemnamespace
          - name: JOB_NAME
            valueFrom:
              secretKeyRef:
                name: performance-test-config
                key: jobname
          - name: BUILD_ID
            valueFrom:
              secretKeyRef:
                name: performance-test-config
                key: buildid
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 1000m
            memory: 3Gi
        securityContext:
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: experiments-results
            mountPath: /experiments
      volumes:
        - name: experiments-results
          persistentVolumeClaim:
            claimName: experiments-results
      restartPolicy: Never
